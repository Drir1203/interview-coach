# AI面师 管理后台（admin.mianshi.pro）——由 scripts/deploy.sh 同步至 /etc/nginx/sites-enabled/
# 前置条件（首次一次性）：
#   1. DNS：admin.mianshi.pro A 记录 → 43.129.23.197
#   2. 证书：sudo certbot --nginx -d admin.mianshi.pro（生成 /etc/letsencrypt/live/admin.mianshi.pro/）
server {
    listen 443 ssl http2;
    server_name admin.mianshi.pro;

    ssl_certificate     /etc/letsencrypt/live/admin.mianshi.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.mianshi.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;

    # 子域名根 → 后台
    location = / { return 308 /interview/admin/; }

    # 后台页面 + /_next 静态资源 + /interview/api/admin/* 全部透传到 Next.js
    location /interview {
        add_header Cache-Control "no-store";
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name admin.mianshi.pro;
    # Let's Encrypt 续期挑战（与主站共用 /var/www/html）
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
